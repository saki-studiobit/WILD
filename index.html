<style>
  :root{
    --bg:#F6F5F0;
    --surface:#FFFFFF;
    --border:#E3E0D6;
    --text:#22271F;
    --text-muted:#767C70;
    --accent:#2F5D50;
    --accent-light:#E4EEE9;
    --ok:#2F5D50;
    --ok-bg:#E4EEE9;
    --low:#A9711F;
    --low-bg:#FBEEDC;
    --urgent:#AE3B27;
    --urgent-bg:#FBE5DF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .screen{flex:1;padding:20px 18px 90px;overflow-y:auto;}
  .auth-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;}
  .brand{text-align:center;margin-bottom:28px;}
  .brand-mark{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;margin:0 auto 12px;}
  .brand h1{font-size:20px;margin:0;font-weight:600;}
  .brand p{font-size:13px;color:var(--text-muted);margin:4px 0 0;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:var(--surface);color:var(--text);}
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .role-toggle{display:flex;gap:8px;margin-bottom:6px;}
  .role-opt{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--border);font-size:13px;color:var(--text-muted);background:var(--surface);}
  .role-opt.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600;}
  .btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;text-align:center;}
  .btn:active{opacity:0.85;}
  .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:var(--urgent-bg);color:var(--urgent);}
  .link-btn{background:none;border:none;color:var(--accent);font-size:13px;text-decoration:underline;padding:0;}
  .error-text{color:var(--urgent);font-size:12px;margin:-6px 0 12px;}
  .switch-line{text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);}

  header.topbar{padding:16px 18px 12px;background:var(--bg);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;}
  .greet{font-size:18px;font-weight:600;margin:0;}
  .greet-sub{font-size:12px;color:var(--text-muted);margin:2px 0 0;}
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
  .back-btn{background:none;border:none;font-size:20px;color:var(--text);padding:0 4px 0 0;}
  .icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .loc-card{display:flex;align-items:center;justify-content:space-between;}
  .loc-name{font-size:15px;font-weight:600;margin:0;}
  .loc-sub{font-size:12px;color:var(--text-muted);margin:2px 0 0;}
  .badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-low{background:var(--low-bg);color:var(--low);}
  .badge-urgent{background:var(--urgent-bg);color:var(--urgent);}
  .badge-neutral{background:#EEEDE6;color:var(--text-muted);}

  .stat-row{display:flex;gap:8px;margin-bottom:14px;}
  .stat-pill{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;}
  .stat-num{font-size:19px;font-weight:700;margin:0;}
  .stat-label{font-size:10px;color:var(--text-muted);margin:2px 0 0;}

  .attend-card{background:var(--accent);color:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .attend-card.out{background:var(--surface);color:var(--text);border:1px solid var(--border);}
  .attend-status{font-size:13px;opacity:0.85;margin:0 0 2px;}
  .attend-card.out .attend-status{color:var(--text-muted);opacity:1;}
  .attend-time{font-size:16px;font-weight:600;margin:0 0 12px;}
  .attend-btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;background:#fff;color:var(--accent);}
  .attend-card.out .attend-btn{background:var(--accent);color:#fff;}

  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;}
  .chip{flex:0 0 auto;padding:7px 14px;border-radius:20px;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);white-space:nowrap;}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent);}

  .search-wrap{margin-bottom:12px;}
  .search-wrap input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--surface);}

  .item-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--border);gap:10px;}
  .item-row:last-child{border-bottom:none;}
  .item-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .item-thumb{width:38px;height:38px;border-radius:8px;background:var(--accent-light);color:var(--accent);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;object-fit:cover;}
  .status-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .dot-ok{background:var(--ok);}
  .dot-low{background:var(--low);}
  .dot-urgent{background:var(--urgent);}
  .item-name{font-size:14px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-meta{font-size:12px;color:var(--text-muted);margin:1px 0 0;}
  .empty-note{text-align:center;color:var(--text-muted);font-size:13px;padding:30px 10px;}

  .fab-row{display:flex;gap:8px;margin-top:12px;}
  .fab-row .btn{padding:11px;font-size:13px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,22,18,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
  .modal-sheet{background:var(--surface);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px 20px 28px;max-height:88vh;overflow-y:auto;}
  .modal-title{font-size:17px;font-weight:600;margin:0 0 16px;}
  .qty-control{display:flex;align-items:center;gap:14px;justify-content:center;margin:10px 0 18px;}
  .qty-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:20px;font-weight:600;color:var(--accent);}
  .qty-val{font-size:26px;font-weight:700;min-width:70px;text-align:center;}
  .modal-row-actions{display:flex;gap:8px;margin-top:16px;}
  .photo-row{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
  .photo-preview{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--accent-light);flex:0 0 auto;}
  .photo-placeholder{width:64px;height:64px;border-radius:10px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
  .mgr-note{font-size:11px;color:var(--text-muted);background:#EEEDE6;padding:8px 10px;border-radius:8px;margin-bottom:14px;}
  .select-add-row{display:flex;gap:8px;}
  .select-add-row select{flex:1;}

  nav.bottom-nav{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:flex;max-width:460px;margin:0 auto;width:100%;}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;background:none;border:none;color:var(--text-muted);font-size:10px;}
  .nav-item.active{color:var(--accent);font-weight:600;}
  .nav-ico{font-size:19px;line-height:1;}

  .recipe-card{margin-bottom:10px;}
  .recipe-top{display:flex;justify-content:space-between;align-items:center;}
  .recipe-name{font-size:15px;font-weight:600;margin:0;}
  .ing-list{font-size:12px;color:var(--text-muted);margin:6px 0 0;}

  .team-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .team-left{display:flex;align-items:center;gap:10px;}
  select.role-select{padding:6px 8px;font-size:12px;border-radius:8px;border:1px solid var(--border);}

  .activity-row{padding:10px 0;border-bottom:1px solid var(--border);}
  .activity-text{font-size:13px;margin:0;}
  .activity-time{font-size:11px;color:var(--text-muted);margin:2px 0 0;}

  .section-title{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin:18px 0 8px;}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:30;max-width:80%;text-align:center;}
  #watermark-fixed{position:fixed;bottom:1px;left:0;right:0;max-width:460px;margin:0 auto;text-align:center;font-size:9px;color:rgba(34,39,31,0.28);pointer-events:none;z-index:2;padding-bottom:1px;}
</style>
</head>

<script>
/* ---------- SUPABASE SETUP ----------
   1. Create a free project at supabase.com
   2. In the SQL Editor, run:

      create table app_kv (
        key text primary key,
        value jsonb,
        updated_at timestamptz default now()
      );
      alter table app_kv enable row level security;
      create policy "public read" on app_kv for select using (true);
      create policy "public insert" on app_kv for insert with check (true);
      create policy "public update" on app_kv for update using (true);

   3. Go to Project Settings -> API and copy your Project URL and
      "anon public" key (NOT the service_role key) into the two
      constants below. The anon key is designed to be used in
      client-side code like this - it is not a secret.
*/
const SUPABASE_URL = 'https://brvtijeadvvblfwwlujz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RqaFYvyhUSWU5q08n4ObWQ_EHsK-BEP';

/* ---------- storage helpers (never block the UI) ---------- */
function withTimeout(promise, ms, fallback){
  return Promise.race([promise, new Promise(resolve=>setTimeout(()=>resolve(fallback), ms))]);
}
async function loadShared(key, fallback){
  try{
    const res = await withTimeout(fetch(`${SUPABASE_URL}/rest/v1/app_kv?key=eq.${encodeURIComponent(key)}&select=value`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    }), 4000, null);
    if(!res || !res.ok) return fallback;
    const rows = await res.json();
    return rows.length ? rows[0].value : fallback;
  }catch(e){ return fallback; }
}
function saveShared(key, val){
  try{
    withTimeout(fetch(`${SUPABASE_URL}/rest/v1/app_kv`, {
      method:'POST',
      headers:{
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type':'application/json',
        Prefer:'resolution=merge-duplicates'
      },
      body: JSON.stringify({key, value: val})
    }), 4000, null);
  }catch(e){}
}
function loadLocal(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveLocal(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

/* ---------- app state ---------- */
let DB = { users:[], locations:[], items:[], recipes:[], activity:[], invites:[], attendance:[], wastage:[], settings:{shiftStart:'08:00', managerCanManageSchedule:false, autoTrimAttendance:false, managerCanManageChecklists:false}, oilLog:[], shifts:[], schedule:[], securityLog:[], events:[], checklists:[], checklistRuns:[], notes:[], priorityChecks:[] };
let session = { userId:null };
let ui = { screen:'loading', tab:'home', authMode:'login', authRole:'staff',
  stockCat:'all', stockSub:'all', stockSearch:'', modal:null, pendingAttendType:null,
  selectedStaffId:null, scheduleUserId:null, recipeCat:'all', scheduleWeekStart:null, alertFilter:null, activeChecklistId:null, recipeSearch:'', priorityCat:'all', myScheduleWeekStart:null };

function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function currentUser(){ return DB.users.find(u=>u.id===session.userId) || null; }
function isMgr(u){ return u && (u.role==='manager'||u.role==='owner'); }
function isOwner(u){ return u && u.role==='owner'; }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function defaultLocations(){
  return [
    {id:uid('loc'), name:'Storage room', subs:[{id:uid('sub'),name:'General shelving'}]},
    {id:uid('loc'), name:'Cafe counter', subs:[{id:uid('sub'),name:'Display case'},{id:uid('sub'),name:'Under counter'}]},
    {id:uid('loc'), name:'Bar counter', subs:[{id:uid('sub'),name:'Under-counter chiller'},{id:uid('sub'),name:'Alcohol shelves'}]},
    {id:uid('loc'), name:'Kitchen', subs:[{id:uid('sub'),name:'Freezer'},{id:uid('sub'),name:'Shelf 1'},{id:uid('sub'),name:'Shelf 2'}]},
  ];
}

async function init(){
  DB.users = await loadShared('inv_users', []);
  const existingLocs = await loadShared('inv_locations', null);
  DB.locations = existingLocs || defaultLocations();
  if(!existingLocs) saveShared('inv_locations', DB.locations);
  DB.items = await loadShared('inv_items', []);
  DB.recipes = await loadShared('inv_recipes', []);
  DB.activity = await loadShared('inv_activity', []);
  DB.invites = await loadShared('inv_invites', []);
  DB.attendance = await loadShared('inv_attendance', []);
  DB.wastage = await loadShared('inv_wastage', []);
  DB.settings = await loadShared('inv_settings', {shiftStart:'08:00', managerCanManageSchedule:false, autoTrimAttendance:false, managerCanManageChecklists:false});
  DB.oilLog = await loadShared('inv_oillog', []);
  DB.shifts = await loadShared('inv_shifts', []);
  DB.schedule = await loadShared('inv_schedule', []);
  DB.securityLog = await loadShared('inv_securitylog', []);
  DB.events = await loadShared('inv_events', []);
  DB.checklists = await loadShared('inv_checklists', null) || defaultChecklists();
  DB.checklistRuns = await loadShared('inv_checklistruns', []);
  DB.notes = await loadShared('inv_notes', []);
  DB.priorityChecks = await loadShared('inv_prioritychecks', []);
  trimOldAttendance();
  trimOldAttendancePhotos();
  trimOldNotes();
  session = await loadLocal('inv_session', {userId:null});
  ui.screen = (session.userId && currentUser()) ? 'main' : 'auth';
  render();
}

function persist(keys){
  if(keys.includes('users')) saveShared('inv_users', DB.users);
  if(keys.includes('locations')) saveShared('inv_locations', DB.locations);
  if(keys.includes('items')) saveShared('inv_items', DB.items);
  if(keys.includes('recipes')) saveShared('inv_recipes', DB.recipes);
  if(keys.includes('activity')) saveShared('inv_activity', DB.activity);
  if(keys.includes('invites')) saveShared('inv_invites', DB.invites);
  if(keys.includes('attendance')) saveShared('inv_attendance', DB.attendance);
  if(keys.includes('wastage')) saveShared('inv_wastage', DB.wastage);
  if(keys.includes('settings')) saveShared('inv_settings', DB.settings);
  if(keys.includes('oilLog')) saveShared('inv_oillog', DB.oilLog);
  if(keys.includes('shifts')) saveShared('inv_shifts', DB.shifts);
  if(keys.includes('schedule')) saveShared('inv_schedule', DB.schedule);
  if(keys.includes('securityLog')) saveShared('inv_securitylog', DB.securityLog);
  if(keys.includes('events')) saveShared('inv_events', DB.events);
  if(keys.includes('checklists')) saveShared('inv_checklists', DB.checklists);
  if(keys.includes('checklistRuns')) saveShared('inv_checklistruns', DB.checklistRuns);
  if(keys.includes('notes')) saveShared('inv_notes', DB.notes);
  if(keys.includes('priorityChecks')) saveShared('inv_prioritychecks', DB.priorityChecks);
}

function logActivity(text){
  const u = currentUser();

/* ---------- image helpers ---------- */
function resizeImageFile(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas, w, h);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function stampTimestamp(canvas, w, h, ts){
  const ctx = canvas.getContext('2d');
  const text = new Date(ts).toLocaleString();
  ctx.font = Math.max(12, Math.round(w/22))+'px -apple-system,Arial,sans-serif';
  const padding = 8;
  const textW = ctx.measureText(text).width;
  const barH = Math.max(22, Math.round(w/16));
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, h-barH, w, barH);
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, padding, h - barH/2);
  return canvas.toDataURL('image/jpeg', 0.55);
}

/* ---------- auth actions ---------- */
async function handleRegister(){
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const password = document.getElementById('reg-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent='';
  if(!name || !email || !password){ errEl.textContent='Fill in all fields.'; return; }
  if(DB.users.some(u=>u.email===email)){ errEl.textContent='That email is already registered.'; return; }
  let role = 'staff';
  if(DB.users.length===0){ role='owner'; }
  else if(ui.authRole==='manager'){
    const code = document.getElementById('reg-invite').value.trim();
    const inv = DB.invites.find(i=>i.code===code && !i.used && i.role==='manager');
    if(!inv){ errEl.textContent='Invalid or already-used invite code.'; return; }
    inv.used = true; inv.usedBy = email;
    role='manager';
  }
  const user = {id:uid('u'), name, email, password, role, phone:''};
  DB.users.push(user);
  persist(['users','invites']);
  session = {userId:user.id};
  saveLocal('inv_session', session);
  logActivity(name+' joined as '+role);
  ui.screen='main'; ui.tab='home';
  render();
}
async function handleLogin(){
  const email = document.getElementById('log-email').value.trim().toLowerCase();
  const password = document.getElementById('log-password').value;
  const errEl = document.getElementById('auth-error');

/* ---------- attendance ---------- */
function lastAttendanceFor(userId){
  const rows = DB.attendance.filter(a=>a.userId===userId);
  return rows.length ? rows[rows.length-1] : null;
}
function isSignedIn(userId){
  const last = lastAttendanceFor(userId);
  return last && last.type==='in';
}
function isSameDay(ts, ref){
  const a = new Date(ts), b = ref || new Date();
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function todaysSignIn(userId){
  const rows = DB.attendance.filter(a=>a.userId===userId && a.type==='in' && isSameDay(a.ts));
  return rows.length ? rows[rows.length-1] : null;
}
const DAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mondayOf(d){ const c=new Date(d); const day=(c.getDay()+6)%7; c.setDate(c.getDate()-day); return c; }
function addDays(ds, n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return dateStr(d); }
function shiftForUserOnDate(userId, ds){
  const entry = DB.schedule.find(s=>s.userId===userId && s.date===ds);
  if(!entry) return null;
  return DB.shifts.find(sh=>sh.id===entry.shiftId) || null;
}
function expectedTimeInFor(userId, ts){
  const shift = shiftForUserOnDate(userId, dateStr(new Date(ts)));
  return shift ? shift.timeIn : (DB.settings.shiftStart || '08:00');
}
function isRecordLate(record){
  if(!record) return false;
  const expected = expectedTimeInFor(record.userId, record.ts);
  const [h,m] = expected.split(':').map(Number);
  const d = new Date(record.ts);
  return (d.getHours()*60+d.getMinutes()) > (h*60+m);
}
function isTimeFormat(v){ return /^([01]?\d|2[0-3]):([0-5]\d)$/.test(v.trim()); }
function normTime(v){ const m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(v.trim()); return m[1].padStart(2,'0')+':'+m[2]; }

const ATTENDANCE_RETENTION_MS = 40*24*60*60*1000;
const ATTENDANCE_PHOTO_RETENTION_MS = 10*24*60*60*1000;
function trimOldAttendance(){
  if(!DB.settings.autoTrimAttendance) return;
  const cutoff = Date.now() - ATTENDANCE_RETENTION_MS;
  const before = DB.attendance.length;
  DB.attendance = DB.attendance.filter(a=>a.ts >= cutoff);
  if(DB.attendance.length !== before) persist(['attendance']);
}
function trimOldAttendancePhotos(){
  const cutoff = Date.now() - ATTENDANCE_PHOTO_RETENTION_MS;
  let changed = false;
  DB.attendance.forEach(a=>{
    if(a.photo && a.ts < cutoff){ a.photo = null; changed = true; }
  });
  if(changed) persist(['attendance']);
}
function toggleAutoTrimAttendance(){
  DB.settings.autoTrimAttendance = !DB.settings.autoTrimAttendance;
  persist(['settings']);
  if(DB.settings.autoTrimAttendance) trimOldAttendance();
  render();
}
function manualTrimAttendance(){
  const cutoff = Date.now() - ATTENDANCE_RETENTION_MS;
  const before = DB.attendance.length;
  DB.attendance = DB.attendance.filter(a=>a.ts >= cutoff);
  persist(['attendance']);
  showToast(`Removed ${before-DB.attendance.length} record(s) older than 40 days`);
  render();
}

function moveItem(itemId, direction, contextIdsCsv){
  const contextIds = contextIdsCsv.split(',');
  const idx = contextIds.indexOf(itemId);
  const targetIdx = idx + direction;
  if(idx===-1 || targetIdx<0 || targetIdx>=contextIds.length) return;
  const neighborId = contextIds[targetIdx];
  const itemPos = DB.items.findIndex(i=>i.id===itemId);
  if(itemPos===-1) return;
  const [moved] = DB.items.splice(itemPos, 1);
  const neighborPos = DB.items.findIndex(i=>i.id===neighborId);
  const insertAt = direction<0 ? neighborPos : neighborPos+1;
  DB.items.splice(insertAt, 0, moved);
  persist(['items']);
  render();
}

/* ---------- csv export ---------- */
function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCSV(filename, headers, rows){
  try{
    const lines = [headers.map(csvEscape).join(',')].concat(rows.map(r=>r.map(csvEscape).join(',')));
    const csv = lines.join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast('Downloading ' + filename);
  }catch(e){
    showToast('Download not supported here — try opening this app in your browser.');
  }
}
function downloadWastageCSV(){
  const rows = DB.wastage.map(w=>[new Date(w.ts).toLocaleString(), w.itemName, w.qty, w.unit, w.reason, w.reportedBy]);

}
function downloadOilLogCSV(){
  const rows = DB.oilLog.map(l=>{
    if(l.type==='received') return [new Date(l.ts).toLocaleString(), 'New oil started', l.grams, '', '', l.reportedBy];
    if(l.type==='delivery') return [new Date(l.ts).toLocaleString(), 'Oil delivery received', l.grams, '', '', l.reportedBy];
    return [new Date(l.ts).toLocaleString(), 'Usage logged', '', l.filtered, l.added, l.reportedBy];
  });
  downloadCSV('oil-log-report.csv', ['Date & time','Type','Grams','Filtered (g)','Added (g)','Reported by'], rows);
}

/* ---------- recipe CSV import ---------- */
function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(field); field=''; rows.push(row); row=[];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || r[0]!=='');
}
function downloadRecipeTemplate(){
  downloadCSV('recipe-template.csv', ['Name','Category','Ingredients','Instructions'], [
    ['Beef Burger','Food','150g ground beef|1 bun|1 slice cheese','Grill patty 4 min per side.|Toast bun.|Assemble and serve warm.'],
    ['Iced Latte','Cafe','2 shots espresso|200ml milk|ice','Pull espresso shots.|Fill glass with ice and milk.|Pour espresso over the top.']
  ]);
}
function importRecipeCSV(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const rows = parseCSV(ev.target.result);
    if(rows.length<2){ showToast('No recipe rows found in that file'); return; }
    const header = rows[0].map(h=>h.trim().toLowerCase());
    const nameIdx = header.indexOf('name');
    const catIdx = header.indexOf('category');
    const ingIdx = header.indexOf('ingredients');
    const insIdx = header.indexOf('instructions');
    if(nameIdx===-1 || ingIdx===-1){ showToast('CSV needs at least Name and Ingredients columns'); return; }
    let count = 0;
    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      const name = (r[nameIdx]||'').trim();
      if(!name) continue;
      const catRaw = catIdx>-1 ? (r[catIdx]||'').trim() : '';
      const category = RECIPE_CATEGORIES.find(c=>c.toLowerCase()===catRaw.toLowerCase()) || 'Food';
      const ingredients = (r[ingIdx]||'').split('|').map(s=>s.trim()).filter(Boolean);
      const instructions = insIdx>-1 ? (r[insIdx]||'').split('|').map(s=>s.trim()).filter(Boolean).join('\n') : '';
      if(!ingredients.length) continue;
      DB.recipes.push({id:uid('rc'), name, category, ingredients, instructions});
      count++;
    }
    persist(['recipes']);
    logActivity(`imported ${count} recipe(s) from CSV`);
    showToast(`Imported ${count} recipe(s)`);
    render();
  };
  reader.readAsText(file);
}

function groupedProductStatuses(){
  const groups = new Map();
  DB.items.forEach(i=>{
    const key = i.name.trim().toLowerCase()+'|'+i.unit;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });
  return Array.from(groups.values()).map(group=>{
    const total = Math.round(group.reduce((s,i)=>s+i.qty,0)*100)/100;
    const low = Math.max(...group.map(i=>i.low||0));
    const urgent = Math.max(...group.map(i=>i.urgent||0));
    const status = total<=urgent ? 'urgent' : total<=low ? 'low' : 'ok';
    return {name:group[0].name, unit:group[0].unit, total, status, itemIds:group.map(i=>i.id), locCount:group.length};
  });
}

function openGroupOrSingle(idsCsv){
  const ids = idsCsv.split(',');
  if(ids.length===1) openItemModal(ids[0]);
  else openItemGroupModal(idsCsv);
}
function renderHome(){
  const u = currentUser();
  const signedIn = isSignedIn(u.id);
  const last = lastAttendanceFor(u.id);
  const attendCard = isOwner(u) ? '' : `
    <div class="attend-card ${signedIn?'':'out'}">
      <p class="attend-status">${signedIn ? 'Signed in since' : (last ? 'Last signed out' : 'Not signed in yet')}</p>
      <p class="attend-time">${last ? new Date(last.ts).toLocaleString([], {hour:'2-digit',minute:'2-digit', month:'short', day:'numeric'}) : '—'}</p>
      <button class="attend-btn" onclick="startAttendance('${signedIn?'out':'in'}')">${signedIn ? 'Time out' : 'Time in'} (take a photo)</button>
    </div>`;
  const myScheduleBtn = isOwner(u) ? '' : `<button class="btn btn-secondary" style="margin-bottom:16px;" onclick="openMyScheduleScreen()">📅 View my schedule</button>`;

  let boostCard = '';
  if(!isOwner(u)){
    const todayIn = todaysSignIn(u.id);
    if(todayIn && isRecordLate(todayIn)){
      const t = new Date(todayIn.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const expected = expectedTimeInFor(u.id, todayIn.ts);
      boostCard = `<div class="card" style="background:var(--urgent-bg);border-color:var(--urgent);">
        <p style="margin:0;font-size:13px;color:var(--urgent);font-weight:600;">⏰ You clocked in at ${t} today — a bit later than your ${expected} start. Let's aim earlier tomorrow!</p>
      </div>`;
    } else {
      boostCard = `<div class="card" style="background:var(--accent-light);">
        <p style="margin:0;font-size:13px;color:var(--accent);font-weight:600;">${randomEncouragingMessage()}</p>
      </div>`;
    }
  }

  const todayStr = dateStr(new Date());
  const upcomingEvents = DB.events.filter(e=>e.date>=todayStr).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);
  const eventsCard = upcomingEvents.length ? `
    <div class="section-title">Upcoming events</div>
    <div class="card" style="padding:6px 16px;">${upcomingEvents.map(e=>{
      const label = new Date(e.date+'T00:00:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
      return `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">🎉 <strong>${label}, ${formatEventTime(e)}</strong> — ${e.title}</div>`;
    }).join('')}</div>` : '';

  const groups = groupedProductStatuses();
  const urgentGroups = groups.filter(g=>g.status==='urgent');
  const lowGroups = groups.filter(g=>g.status==='low');
  const statRow = `
    <div class="stat-row">
      <div class="stat-pill"><p class="stat-num">${DB.items.length}</p><p class="stat-label">Total items</p></div>
      <div class="stat-pill" style="background:var(--low-bg);cursor:pointer;" onclick="${lowGroups.length?`openAlertListScreen('low')`:''}"><p class="stat-num" style="color:var(--low);">${lowGroups.length}</p><p class="stat-label" style="color:var(--low);">Running low</p></div>
      <div class="stat-pill" style="background:var(--urgent-bg);cursor:pointer;" onclick="${urgentGroups.length?`openAlertListScreen('urgent')`:''}"><p class="stat-num" style="color:var(--urgent);">${urgentGroups.length}</p><p class="stat-label" style="color:var(--urgent);">Urgent</p></div>
    </div>`;

  const attention = [...urgentGroups, ...lowGroups].slice(0,8);
  const attentionRows = attention.length ? attention.map(g=>{
    const idsCsv = g.itemIds.join(',');
    return `<div class="item-row" onclick="openGroupOrSingle('${idsCsv}')">
      <div class="item-left"><span class="status-dot ${statusDotClass(g.status)}"></span>
        <div><p class="item-name">${g.name}</p><p class="item-meta">${g.locCount>1?g.locCount+' locations · ':''}${g.total} ${g.unit} total</p></div>
      </div>
      <span class="badge ${statusBadgeClass(g.status)}">${statusLabel(g.status)}</span>
    </div>`;
  }).join('') : `<div class="empty-note">Everything is well stocked.</div>`;

  const actionButtons = isOwner(u) ? '' : `
    <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="openChecklistHub()">✅ Daily Tasks</button>
    <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="openMorningPriorityScreen()">🌅 Morning Priority Inventory</button>
    <button class="btn btn-secondary" style="margin-bottom:16px;" onclick="openWastageModal()">🗑 Report wastage</button>`;

  if(isOwner(u)){
    return `
    <header class="topbar"><div><p class="greet">Hi, ${u.name.split(' ')[0]}</p><p class="greet-sub">Inventory at a glance</p></div></header>
    <div class="screen" style="padding-top:0;">
      ${eventsCard}
      ${renderNotesCard()}
      <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="openAttendanceTodayScreen()">🕒 Today's Time In/Out</button>
      <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="openChecklistHub()">✅ Staff Daily Tasks</button>
      <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="openMorningPriorityScreen()">🌅 Morning Priority Inventory</button>
      <button class="btn btn-secondary" style="margin-bottom:16px;" onclick="openWastageLogScreen()">🗑 Wastage Report</button>
      <div class="section-title">Inventory Summary</div>
      ${statRow}
      <div class="section-title">Needs attention</div>
      <div class="card" style="padding:6px 12px;">${attentionRows}</div>
    </div>`;
  }

  return `
  <header class="topbar"><div><p class="greet">Hi, ${u.name.split(' ')[0]}</p><p class="greet-sub">Inventory at a glance</p></div></header>
  <div class="screen" style="padding-top:0;">
    ${attendCard}
    ${myScheduleBtn}
    ${boostCard}
    ${eventsCard}
    ${renderNotesCard()}
    ${actionButtons}
    ${statRow}
    <div class="section-title">Needs attention</div>
    <div class="card" style="padding:6px 12px;">${attentionRows}</div>
  </div>`;
}

function renderStock(){
  const u = currentUser();
  const search = ui.stockSearch.toLowerCase();
  const catChips = [`<div class="chip ${ui.stockCat==='all'?'active':''}" onclick="setStockCat('all')">All</div>`]
    .concat(DB.locations.map(l=>`<div class="chip ${ui.stockCat===l.id?'active':''}" onclick="setStockCat('${l.id}')">${l.name}</div>`))
    .concat(isMgr(u) ? [`<div class="chip add" onclick="addMainCategoryFromStock()">+ Add category</div>`] : [])
    .join('');

  let subChips = '';
  if(ui.stockCat!=='all'){
    const loc = DB.locations.find(l=>l.id===ui.stockCat);
    subChips = `<div class="chip-row">` +
      [`<div class="chip ${ui.stockSub==='all'?'active':''}" onclick="setStockSub('all')">All locations</div>`]
      .concat(loc.subs.map(s=>`<div class="chip ${ui.stockSub===s.id?'active':''}" onclick="setStockSub('${s.id}')">${s.name}</div>`))
      .concat([`<div class="chip add" onclick="addSubFromStock()">+ Add location</div>`])
      .join('') + `</div>`;
  }

  let items = DB.items.slice();
  if(ui.stockCat!=='all') items = items.filter(i=>i.locId===ui.stockCat);
  if(ui.stockCat!=='all' && ui.stockSub!=='all') items = items.filter(i=>i.subId===ui.stockSub);
  if(search) items = items.filter(i=>i.name.toLowerCase().includes(search) || (i.brand||'').toLowerCase().includes(search));

  let rows;
  if(ui.stockCat==='all'){
    const groups = new Map();
    items.forEach(i=>{
      const key = i.name.trim().toLowerCase()+'|'+i.unit;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(i);
    });
    const groupList = Array.from(groups.values());
    rows = groupList.length ? groupList.map(group=>{
      if(group.length===1){
        const i = group[0];
        const s = itemStatus(i);
        const loc = DB.locations.find(l=>l.id===i.locId);
        const thumb = i.photo ? `<img class="item-thumb" src="${i.photo}" />` : `<div class="item-thumb">${initials(i.name)}</div>`;
        return `<div class="item-row" onclick="openItemModal('${i.id}')">
          <div class="item-left">${thumb}<span class="status-dot ${statusDotClass(s)}"></span>
            <div><p class="item-name">${i.name}</p><p class="item-meta">${loc?loc.name:''} · ${i.qty} ${i.unit}</p></div>
          </div>
          <span class="badge ${statusBadgeClass(s)}">${statusLabel(s)}</span>
        </div>`;
      }
      const total = Math.round(group.reduce((sum,i)=>sum+i.qty,0)*100)/100;
      const groupLow = Math.max(...group.map(i=>i.low||0));
      const groupUrgent = Math.max(...group.map(i=>i.urgent||0));
      const worst = total<=groupUrgent ? 'urgent' : total<=groupLow ? 'low' : 'ok';
      const first = group[0];
      const thumb = first.photo ? `<img class="item-thumb" src="${first.photo}" />` : `<div class="item-thumb">${initials(first.name)}</div>`;
      const idsCsv = group.map(i=>i.id).join(',');
      return `<div class="item-row" onclick="openItemGroupModal('${idsCsv}')">
        <div class="item-left">${thumb}<span class="status-dot ${statusDotClass(worst)}"></span>
          <div><p class="item-name">${first.name}</p><p class="item-meta">${group.length} locations · ${total} ${first.unit} total</p></div>
        </div>

function renderWeeklyScheduleRows(userId, weekStart){
  return [0,1,2,3,4,5,6].map(offset=>{
    const ds = addDays(weekStart, offset);
    const label = new Date(ds+'T00:00:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
    const shift = shiftForUserOnDate(userId, ds);
    const dayEvents = DB.events.filter(e=>e.date===ds);
    const eventLine = dayEvents.length ? `<div style="font-size:11px;color:var(--accent);margin-top:2px;">${dayEvents.map(e=>'🎉 '+formatEventTime(e)+' '+e.title).join(', ')}</div>` : '';
    return `<div style="padding:6px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;font-size:13px;">
        <span>${label}</span><span style="color:${shift?'var(--text)':'var(--text-muted)'};">${shift ? shift.name+' · '+shift.timeIn+'–'+shift.timeOut : 'Off'}</span>
      </div>
      ${eventLine}
    </div>`;
  }).join('');
}

function formatEventTime(e){ return e.endTime ? e.time+'–'+e.endTime : e.time; }
function renderEventsManage(){
  if(!ui.scheduleWeekStart) ui.scheduleWeekStart = dateStr(mondayOf(new Date()));
  const weekStart = ui.scheduleWeekStart;
  const weekEnd = addDays(weekStart, 6);
  const weekLabel = new Date(weekStart+'T00:00:00').toLocaleDateString([], {month:'short', day:'numeric'}) + ' – ' + new Date(weekEnd+'T00:00:00').toLocaleDateString([], {month:'short', day:'numeric'});
  const eventRows = [0,1,2,3,4,5,6].map(offset=>{
    const ds = addDays(weekStart, offset);
    const d = new Date(ds+'T00:00:00');
    const label = d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
    const dayEvents = DB.events.filter(e=>e.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
    const evHtml = dayEvents.map(e=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;">
        <span style="font-size:12px;">🎉 ${formatEventTime(e)} — ${e.title}</span>

      </div>`).join('');
    return `<div style="padding:8px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <p style="font-size:12px;font-weight:600;margin:0;">${label}</p>
        <button class="link-btn" onclick="openEventModal('${ds}')">+ Add event</button>
      </div>
      ${evHtml}
    </div>`;
  }).join('');
  return `
  <header class="topbar"><div class="back-row"><button class="back-btn" onclick="backToMain()">‹</button><p class="greet" style="font-size:16px;">Events &amp; Reservations</p></div></header>

      <button class="btn btn-secondary" style="width:auto;padding:8px 12px;" onclick="shiftScheduleWeek(1)">Next ›</button>

    <div class="card">${eventRows}</div>
  </div>`;
}
function openEventModal(ds){
  ui.modal = {type:'event-form', date:ds};
  render();
}
function saveEvent(){
  const time = document.getElementById('ev-time').value || '00:00';
  const endTime = document.getElementById('ev-endtime').value || '';
  const title = document.getElementById('ev-title').value.trim();
  if(!title){ showToast('Give the event a name'); return; }
  const u = currentUser();
  DB.events.push({id:uid('ev'), date:ui.modal.date, time, endTime, title, createdBy:u.name});
  persist(['events']);
  logActivity(`added event "${title}" on ${ui.modal.date}`);
  closeModal();
}
function deleteEvent(id){
  DB.events = DB.events.filter(e=>e.id!==id);
  persist(['events']);
  render();
}

      </div>
    </div>
    ${lastReceived ? `<p style="font-size:12px;color:var(--text-muted);margin:-6px 0 12px;">Current fryer batch in use since ${new Date(lastReceived.ts).toLocaleDateString()}</p>` : ''}`;
  const rows = DB.oilLog.length ? DB.oilLog.map(l=>{
    const text = l.type==='received' ? `New oil started — ${l.grams}g`
      : l.type==='delivery' ? `Oil delivery received — ${l.grams}g`
      : `Filtered ${l.filtered}g, topped up ${l.added}g — <strong>${l.usage}g used</strong>`;
    return `<div class="activity-row"><p class="activity-text">${text}</p><p class="activity-time">${l.reportedBy} · ${new Date(l.ts).toLocaleString()}</p></div>`;
  }).join('') : '';
  return `
  <header class="topbar"><div class="back-row"><button class="back-btn" onclick="backToMain()">‹</button><p class="greet" style="font-size:16px;">Cooking oil log</p></div></header>
  <div class="screen" style="padding-top:0;">
    ${summaryCard}
    <div class="fab-row">
      <button class="btn btn-secondary" onclick="openOilDeliveryModal()">📦 Log oil delivery</button>
      <button class="btn btn-secondary" onclick="openOilStartModal()">${item ? 'Oil too dark — start new' : 'Set up oil tracking'}</button>
    </div>
    ${item ? `<div class="fab-row"><button class="btn" onclick="openOilUsageModal()">Log today's usage</button></div>` : ''}
    <div class="section-title">History</div>
    ${DB.oilLog.length ? `<div style="display:flex;gap:6px;margin-bottom:8px;">
      <button class="btn btn-secondary" style="width:auto;padding:6px 10px;font-size:11px;" onclick="downloadOilLogCSV()">⬇ CSV</button>
      <button class="btn btn-secondary" style="width:auto;padding:6px 10px;font-size:11px;color:var(--urgent);" onclick="clearOldOilLog()">🗑 Clear 40+ days</button>
    </div>` : ''}
    <div class="card" style="padding:6px 12px;">${rows || '<div class="empty-note">No entries yet.</div>'}</div>
  </div>`;
}

/* ---------- best-effort security logging ----------
   NOTE: browsers give web pages no reliable way to detect or block
   screenshots, and there is no such API at all on mobile browsers.
   This only catches the literal desktop "Print Screen" key as a
   weak, partial signal — it will not catch phone screenshots, Mac
   screenshot shortcuts, or snipping tools. */
function logSecurityEvent(text){
  const u = currentUser();
  if(!u) return;
  DB.securityLog.unshift({id:uid('sec'), userId:u.id, userName:u.name, ts:Date.now(), event:text});
  DB.securityLog = DB.securityLog.slice(0,200);
  persist(['securityLog']);
}
document.addEventListener('keydown', function(e){
  if(e.key==='PrintScreen'){
    logSecurityEvent('Print Screen key pressed (desktop only — not a full screenshot guarantee)');
  }
});
function openSecurityLogScreen(){ ui.screen='security-log'; render(); }
function renderSecurityLog(){
  const rows = DB.securityLog.length ? DB.securityLog.map(s=>`
    <div class="activity-row"><p class="activity-text"><strong>${s.userName}</strong> — ${s.event}</p><p class="activity-time">${new Date(s.ts).toLocaleString()}</p></div>
  `).join('') : `<div class="empty-note">No flagged events yet.</div>`;
  return `
  <header class="topbar"><div class="back-row"><button class="back-btn" onclick="backToMain()">‹</button><p class="greet" style="font-size:16px;">Security log</p></div></header>
  <div class="screen" style="padding-top:0;">
    <p class="mgr-note">This only catches the desktop Print Screen key — it can't detect phone screenshots or other capture methods. Every screen also shows a small name/time watermark so any leaked image can be traced back to who was logged in.</p>
    <div class="card">${rows}</div>
  </div>`;
}

function renderChecklistHub(){
  const u = currentUser();
  const today = dateStr(new Date());
  const rows = DB.checklists.map(cl=>{
    const run = DB.checklistRuns.find(r=>r.checklistId===cl.id && r.date===today);
    const done = run ? run.checkedTaskIds.length : 0;
    const total = cl.tasks.length;
    const complete = total>0 && done===total;
    const editBtn = canManageChecklists(u) ? `<button class="link-btn" style="margin-right:10px;" onclick="event.stopPropagation();openChecklistEditScreen('${cl.id}')">Edit</button>` : '';
    return `<div class="team-row" onclick="openChecklistRun('${cl.id}')">
      <div><p style="font-size:13px;font-weight:600;margin:0;">${cl.name}</p><p style="font-size:11px;color:var(--text-muted);margin:0;">${done}/${total} done today${complete?' ✅':''}</p></div>
      <div style="display:flex;align-items:center;">${editBtn}<span style="color:var(--text-muted);">›</span></div>
    </div>`;
  }).join('');
  return `
  <header class="topbar"><div class="back-row"><button class="back-btn" onclick="backToMain()">‹</button><p class="greet" style="font-size:16px;">Checklists</p></div></header>
  <div class="screen" style="padding-top:0;">
    <div class="card">${rows || '<div class="empty-note">No checklists set up yet.</div>'}</div>
  </div>`;
}
function renderChecklistRun(){
  const u = currentUser();
  const readOnly = isOwner(u);
  const cl = DB.checklists.find(c=>c.id===ui.activeChecklistId);
  if(!cl) return `<header class="topbar"><div class="back-row"><button class="back-btn" onclick="openChecklistHub()">‹</button></div></header>`;
  const run = runForToday(cl.id);
  const rows = cl.tasks.map(t=>{
    const checked = run.checkedTaskIds.includes(t.id);
    return `<div class="team-row" style="${readOnly?'':'cursor:pointer;'}" ${readOnly?'':`onclick="toggleChecklistTask('${cl.id}','${t.id}')"`}>
      <p style="font-size:14px;margin:0;${checked?'text-decoration:line-through;color:var(--text-muted);':''}">${t.text}</p>
      <span style="font-size:18px;color:${checked?'var(--accent)':'var(--border)'};">${checked?'☑':'☐'}</span>
    </div>`;
  }).join('');
  return `
  <header class="topbar"><div class="back-row"><button class="back-btn" onclick="${readOnly?'backToMain()':'openChecklistHub()'}">‹</button><p class="greet" style="font-size:16px;">${cl.name}</p></div></header>
  <div class="screen" style="padding-top:0;">
    <p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;">Today, ${new Date().toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'})}${readOnly?' · view only':''}</p>
    <div class="card">${rows || '<div class="empty-note">No tasks yet.</div>'}</div>
    ${run.completedBy ? `<p style="font-size:11px;color:var(--text-muted);text-align:center;">Last updated by ${run.completedBy}</p>` : ''}
    ${canManageChecklists(u) ? `<button class="btn btn-secondary" style="margin-top:14px;" onclick="openChecklistEditScreen('${cl.id}')">Edit this checklist's tasks</button>` : ''}
  </div>`;
}
function renderMorningPriority(){
  const allPinned = DB.items.filter(i=>i.pinned);
  const total = allPinned.length;

  const catChips = ['all', ...new Set(allPinned.map(i=>i.locId))].map(catId=>{
    const label = catId==='all' ? 'All' : (DB.locations.find(l=>l.id===catId)?.name || 'Other');
    return `<div class="chip ${ui.priorityCat===catId?'active':''}" onclick="setPriorityCat('${catId}')">${label}</div>`;
  }).join('');

  const pinned = ui.priorityCat==='all' ? allPinned : allPinned.filter(i=>i.locId===ui.priorityCat);
  const u = currentUser();
  const pinnedIdsCsv = pinned.map(i=>i.id).join(',');

  function renderSingleRow(i, idx){
    const s = itemStatus(i);
    const thumb = i.photo ? `<img class="item-thumb" src="${i.photo}" />` : `<div class="item-thumb">${initials(i.name)}</div>`;
    const loc = DB.locations.find(l=>l.id===i.locId);
    const moveBtns = (isMgr(u) && idx!==undefined) ? `<div style="display:flex;flex-direction:column;margin-left:6px;">
      <button class="link-btn" style="padding:0;line-height:1;${idx===0?'visibility:hidden;':''}" onclick="event.stopPropagation();moveItem('${i.id}',-1,'${pinnedIdsCsv}')">▲</button>
      <button class="link-btn" style="padding:0;line-height:1;${idx===pinned.length-1?'visibility:hidden;':''}" onclick="event.stopPropagation();moveItem('${i.id}',1,'${pinnedIdsCsv}')">▼</button>
    </div>` : '';
    return `<div class="item-row" onclick="openItemModal('${i.id}')">
      <div class="item-left">${thumb}<span class="status-dot ${statusDotClass(s)}"></span>
        <div><p class="item-name">${i.name}</p><p class="item-meta">${ui.priorityCat==='all' && loc ? loc.name+' · ' : ''}${i.qty} ${i.unit}</p></div>
      </div>
      <div style="display:flex;align-items:center;">
        <span class="badge ${statusBadgeClass(s)}">${statusLabel(s)}</span>
        ${moveBtns}
      </div>
    </div>`;
  }

  let sections;
  if(ui.priorityCat==='all'){
    const groups = new Map();
    pinned.forEach(i=>{
      const key = i.name.trim().toLowerCase()+'|'+i.unit;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(i);
    });
    const rows = Array.from(groups.values()).map(group=>{
      if(group.length===1) return renderSingleRow(group[0]);
      const total = Math.round(group.reduce((sum,i)=>sum+i.qty,0)*100)/100;
      const groupLow = Math.max(...group.map(i=>i.low||0));
      const groupUrgent = Math.max(...group.map(i=>i.urgent||0));
      const worst = total<=groupUrgent ? 'urgent' : total<=groupLow ? 'low' : 'ok';
      const first = group[0];
      const thumb = first.photo ? `<img class="item-thumb" src="${first.photo}" />` : `<div class="item-thumb">${initials(first.name)}</div>`;
      const idsCsv = group.map(i=>i.id).join(',');
      return `<div class="item-row" onclick="openItemGroupModal('${idsCsv}')">
        <div class="item-left">${thumb}<span class="status-dot ${statusDotClass(worst)}"></span>
          <div><p class="item-name">${first.name}</p><p class="item-meta">${group.length} locations · ${total} ${first.unit} total</p></div>
        </div>
        <span class="badge ${statusBadgeClass(worst)}">${statusLabel(worst)}</span>
      </div>`;
    }).join('');
    sections = `<div class="card" style="padding:6px 12px;">${rows}</div>`;
  } else {
    const rows = pinned.map((i,idx)=>renderSingleRow(i,idx)).join('');
    sections = `<div class="card" style="padding:6px 12px;">${rows}</div>`;
  }

  return `
  <header class="topbar"><div class="back-row"><button class="back-btn" onclick="backToMain()">‹</button><p class="greet" style="font-size:16px;">Morning Priority Inventory</p></div></header>
  <div class="screen" style="padding-top:0;">
    ${total ? `<div class="chip-row">${catChips}</div>` : ''}
    ${sections || '<div class="empty-note">No items pinned yet. Owners and managers can pin items from the item edit screen in Inventory.</div>'}
  </div>`;
}
function renderChecklistManage(){
  const u = currentUser();
  const rows = DB.checklists.map(cl=>`
    <div class="team-row">
      <div style="flex:1;cursor:pointer;" onclick="openChecklistEditScreen('${cl.id}')"><p style="font-size:13px;font-weight:600;margin:0;">${cl.name}</p><p style="font-size:11px;color:var(--text-muted);margin:0;">${cl.tasks.length} task${cl.tasks.length===1?'':'s'}</p></div>
      <button class="link-btn" style="color:var(--urgent);margin-right:8px;" onclick="deleteChecklist('${cl.id}')">Delete</button>
      <span style="color:var(--text-muted);" onclick="openChecklistEditScreen('${cl.id}')">›</span>
    </div>`).join('');
  const toggleHtml = isOwner(u) ? `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <div><p style="font-size:13px;font-weight:600;margin:0;">Manager access</p><p style="font-size:11px;color:var(--text-muted);margin:2px 0 0;">Let managers edit checklist tasks too</p></div>
      <button class="btn ${DB.settings.managerCanManageChecklists?'':'btn-secondary'}" style="width:auto;padding:8px 14px;" onclick="toggleManagerChecklistAccess()">${DB.settings.managerCanManageChecklists?'On':'Off'}</button>
    </div>` : '';
  return `
  <header class="topbar">
    <div class="back-row"><button class="back-btn" onclick="backToMain()">‹</button><p class="greet" style="font-size:16px;">Manage Task</p></div>
    <button class="icon-btn" onclick="openNewChecklistModal()">+</button>
  </header>
  <div class="screen" style="padding-top:0;">
    ${toggleHtml}
    <div class="card">${rows || '<div class="empty-note">No checklists yet.</div>'}</div>
  </div>`;
}
function renderChecklistEdit(){
  const cl = DB.checklists.find(c=>c.id===ui.activeChecklistId);
  if(!cl) return '';
  const rows = cl.tasks.map(t=>`
    <div class="team-row">
      <p style="font-size:13px;margin:0;flex:1;">${t.text}</p>
      <div style="display:flex;gap:10px;">
        <button class="link-btn" onclick="openTaskFormModal('${cl.id}','${t.id}')">Edit</button>
        <button class="link-btn" style="color:var(--urgent);" onclick="removeChecklistTask('${cl.id}','${t.id}')">Delete</button>
      </div>
    </div>`).join('');
  return `
  <header class="topbar"><div class="back-row"><button class="back-btn" onclick="openChecklistManageScreen()">‹</button><p class="greet" style="font-size:16px;">${cl.name}</p></div></header>
  <div class="screen" style="padding-top:0;">
    <div class="card">${rows || '<div class="empty-note">No tasks yet.</div>'}</div>
    <button class="btn btn-secondary" onclick="openTaskFormModal('${cl.id}', null)">+ Add task</button>
  </div>`;
}
function renderTaskFormModal(){
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-sheet">
      <p class="modal-title">${ui.modal.taskId ? 'Edit task' : 'New task'}</p>
      <div class="field"><input id="task-text" value="${ui.modal.text||''}" placeholder="e.g. Wipe down all tables" /></div>
      <div class="modal-row-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn" onclick="saveTaskForm()">Save</button>
      </div>
    </div>
  </div>`;
}
function renderNewChecklistModal(){
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-sheet">
      <p class="modal-title">New checklist</p>
      <div class="field"><label>Name</label><input id="newcl-name" placeholder="e.g. Monthly Deep Clean" /></div>
      <div class="modal-row-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn" onclick="saveNewChecklist()">Create</button>
      </div>
    </div>
  </div>`;
}
function renderPhoneModal(){
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-sheet">
      <p class="modal-title">Contact number</p>
      <div class="field"><input id="phone-text" type="tel" value="${ui.modal.phone||''}" placeholder="e.g. 0917 123 4567" /></div>
      <div class="modal-row-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn" onclick="savePhone()">Save</button>
      </div>
    </div>
  </div>`;
}

init();
</script>
